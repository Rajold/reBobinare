<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ficha de Rebobinado - Motor Monofásico</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>

<div class="container">

    <h1>Ficha Técnica de Rebobinado</h1>
    <h2>Motor Monofásico</h2>

    <form id="motorForm">

        <!-- DATOS GENERALES -->
        <section>
            <h3>1. Datos generales del motor</h3>

            <label>
    Tipo de motor:
    <select name="tipo" id="tipoMotor">

        <option value="Motor monofásico de inducción">
            Monofásico de inducción
        </option>

        <option value="Motor trifásico de inducción">
            Trifásico de inducción
        </option>

        <option value="Motor universal">
            Universal (AC/DC)
        </option>

        <option value="Motor corriente continua">
            Corriente continua (DC)
        </option>

        <option value="Otro">
            Otro
        </option>

    </select>
</label>


<label>
    Número de fases:
    <select name="fases">

        <option value="1">1 fase</option>
        <option value="3">3 fases</option>
        <option value="DC">DC</option>

    </select>
</label>


<label>
    Sistema de arranque:
    <input 
        type="text" 
        name="arranque"
        value="Capacitor permanente + capacitor de arranque">
</label>

            <label>
                Observación general:
                <textarea name="observaciones"></textarea>
            </label>

        </section>


        <!-- DATOS MECANICOS -->
        <section>
            <h3>2. Datos mecánicos</h3>

            <div class="grid">

                <label>
                    Diámetro rotor (mm):
                    <input type="number" name="rotorDiametro">
                </label>

                <label>
                    Largo rotor (mm):
                    <input type="number" name="rotorLargo">
                </label>

                <label>
                    Diámetro exterior estator (mm):
                    <input type="number" name="estatorExterior">
                </label>

                <label>
                    Diámetro interior estator (mm):
                    <input type="number" name="estatorInterior">
                </label>

                <label>
                    Largo paquete estator (mm):
                    <input type="number" name="estatorLargo">
                </label>

                <label>
                    Número de ranuras:
                    <input type="number" name="ranuras">
                </label>

            </div>

        </section>


        <!-- CAPACITORES -->
        <section>

            <h3>3. Capacitores</h3>

            <div class="grid">

                <label>
                    Capacitor permanente (µF):
                    <input type="number" name="capPermanente">
                </label>

                <label>
                    Voltaje capacitor permanente:
                    <input type="number" name="voltCapPermanente">
                </label>

                <label>
                    Capacitor arranque (µF):
                    <input type="number" name="capArranque">
                </label>

                <label>
                    Voltaje capacitor arranque:
                    <input type="number" name="voltCapArranque">
                </label>

            </div>

        </section>


        <!-- TERMINALES -->
        <section>

            <h3>4. Bornera</h3>

            <table>

                <tr>
                    <th>Terminal</th>
                    <th>Color</th>
                    <th>Función</th>
                </tr>

                <tr>
                    <td><input name="termU1" value="U1"></td>
                    <td><input name="colorU1" value="Rojo"></td>
                    <td><input name="funcU1" value="Devanado principal"></td>
                </tr>

                <tr>
                    <td><input name="termU2" value="U2"></td>
                    <td><input name="colorU2" value="Verde"></td>
                    <td><input name="funcU2" value="Devanado principal"></td>
                </tr>

                <tr>
                    <td><input name="termV1" value="V1"></td>
                    <td><input name="colorV1" value="Azul"></td>
                    <td><input name="funcV1" value="Devanado auxiliar"></td>
                </tr>

                <tr>
                    <td><input name="termV2" value="V2"></td>
                    <td><input name="colorV2" value="Negro"></td>
                    <td><input name="funcV2" value="Devanado auxiliar"></td>
                </tr>

                <tr>
                    <td><input name="termW1" value="W1"></td>
                    <td><input name="colorW1" value="Blanco"></td>
                    <td><input name="funcW1" value="Conexión capacitores"></td>
                </tr>

                <tr>
                    <td><input name="termW2" value="W2"></td>
                    <td><input name="colorW2" value="Amarillo"></td>
                    <td><input name="funcW2" value="Interruptor centrífugo"></td>
                </tr>

            </table>

        </section>


        <!-- DEVANADO AUXILIAR -->
        <section>

            <h3>5. Devanado auxiliar</h3>

            <label>
                Material:
                <input name="materialAux" value="Aluminio original / Cobre reemplazo">
            </label>

            <label>
                Calibre original:
                <input name="calibreAuxOriginal" value="0.90 mm Al">
            </label>

            <label>
                Calibre cobre:
                <input name="calibreAuxCobre" value="AWG 21">
            </label>


            <table>

                <tr>
                    <th>Espiras</th>
                    <th>Bobina 1</th>
                    <th>Bobina 2</th>
                </tr>

                <tbody id="auxiliar">

                </tbody>

            </table>

        </section>


        <!-- DEVANADO PRINCIPAL -->
        <section>

            <h3>6. Devanado principal</h3>

            <label>
                Material:
                <input name="materialPrincipal" value="Aluminio original / Cobre reemplazo">
            </label>

            <label>
                Calibre original:
                <input name="calibrePrincipalOriginal" value="1.05 mm Al">
            </label>

            <label>
                Calibre cobre:
                <input name="calibrePrincipalCobre" value="AWG 20">
            </label>


            <table>

                <tr>
                    <th>Espiras</th>
                    <th>Bobina 1</th>
                    <th>Bobina 2</th>
                </tr>

                <tbody id="principal">

                </tbody>

            </table>

        </section>


        <!-- MATERIAL -->
        <section>

            <h3>7. Material recomendado</h3>

            <label>
                Peso cobre marcha:
                <input name="pesoMarcha" value="600 g AWG 20">
            </label>

            <label>
                Peso cobre arranque:
                <input name="pesoArranque" value="500 g AWG 21">
            </label>

        </section>


        <button type="button" id="btnPDF">
            Generar PDF
        </button>


    </form>

</div>


<script src="app.js"></script>

</body>
</html>
